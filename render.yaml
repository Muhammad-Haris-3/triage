services:
  - type: web
    name: triage-api
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_DATABASE_URL
        sync: false          # set in the Render dashboard; never committed
      - key: PYTHON_VERSION
        value: "3.13.1"
